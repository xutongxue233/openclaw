name: Verify workspace compiler cache fix
on:
  push:
    branches: [proof/issue-176778]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1bf0e576697740101a100aced44dc8f6693927a7
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: off
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove regressions fail with the original exclusion policy
        shell: bash
        run: |
          set -euo pipefail
          owner=src/gateway/worker-environments/workspace-path-exclusions.ts
          cp "$owner" "$RUNNER_TEMP/fixed-exclusions.ts"
          trap 'cp "$RUNNER_TEMP/fixed-exclusions.ts" "$owner"' EXIT
          git show 8a23c56a83384d40e89c3dd8d92f7cee5e520c10:"$owner" > "$owner"
          set +e
          pnpm test src/gateway/worker-environments/workspace-generated-paths.test.ts src/gateway/worker-environments/local-workspace-projection.test.ts --maxWorkers=1 -t 'generated runtime roots|old runtime-file' --reporter=json --outputFile="$RUNNER_TEMP/red.json" > "$RUNNER_TEMP/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$result" -ne 0
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/red.json`, 'utf8'));
          const assertions = report.testResults.flatMap((result) => result.assertionResults);
          const capture = assertions.find((test) => test.fullName.includes('excludes only generated runtime roots'));
          assert.equal(capture?.status, 'failed');
          assert.match(capture.failureMessages.join('\n'), /Cloud workspace result is too large: \.artifacts\/vitest-worker-cache/);
          for (const copied of ['false', 'true']) {
            const recovery = assertions.find((test) => test.fullName.includes(`settles old runtime-file results (source already copied: ${copied})`));
            assert.equal(recovery?.status, 'failed');
            assert.match(recovery.failureMessages.join('\n'), /Local sandbox edits conflict with the managed workspace/);
          }
          console.log('Confirmed capture and both authenticated recovery regressions fail on the original policy.');
          NODE
      - name: Verify fixed capture, transfer, reconciliation, and recovery
        run: |
          set -euo pipefail
          pnpm test src/gateway/worker-environments/workspace-generated-paths.test.ts src/gateway/worker-environments/local-workspace-projection.test.ts src/gateway/worker-environments/workspace-reconcile-recovery.test.ts src/gateway/worker-environments/workspace-result-repository.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/green.log"
      - name: Check changed-file formatting and patch
        run: |
          pnpm format:check src/gateway/worker-environments/workspace-path-exclusions.ts src/gateway/worker-environments/workspace-generated-paths.test.ts src/gateway/worker-environments/local-workspace-generated-paths.test-support.ts docs/gateway/sandboxing/workspace-access.md
          git diff --exit-code
          git diff --check HEAD^
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-176778-proof
          path: |
            ${{ runner.temp }}/red.json
            ${{ runner.temp }}/red.log
            ${{ runner.temp }}/green.log
          retention-days: 14
